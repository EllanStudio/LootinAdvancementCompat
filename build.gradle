plugins {
    id 'java'
}

group = 'com.ellanserver'
version = '1.0.0'

def paperApiVersion = providers.gradleProperty('paperApiVersion').orElse('26.3.build.157-beta').get()
def javaToolchainVersion = providers.gradleProperty('javaToolchain').orElse('25').get().toInteger()
def javaRelease = providers.gradleProperty('javaRelease').orElse('21').get().toInteger()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaToolchainVersion)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

sourceSets {
    lootinApi {
        java.srcDir 'src/lootinApi/java'
    }
    main {
        compileClasspath += lootinApi.output
    }
}

configurations {
    lootinApiCompileOnly.extendsFrom compileOnly
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    lootinApiCompileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    testImplementation platform('org.junit:junit-bom:5.14.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('compileJava') {
    dependsOn tasks.named('compileLootinApiJava')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaRelease
}

tasks.named('jar') {
    archiveBaseName = 'EllanLootinAdvancementCompat'
}

tasks.named('test') {
    useJUnitPlatform()
}
